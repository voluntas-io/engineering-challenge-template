[package]
name = "engineering-challenge"
version = "0.3.0"
edition = "2024"
build = "src/util/build.rs"
description = "Low-latency prediction-market order-book collector for the Voluntas engineering challenge"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossbeam = "0.8"
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem", "rand_core"] }
futures-util = "0.3"
http = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
rsa = { version = "0.9.8", features = ["sha2", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

[dev-dependencies]
tempfile = "3"

# Standalone numeric-model benchmark; runs on stable Rust and prints timings.
[[bench]]
name = "numeric_model"
harness = false

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
# The generated SBE codec contains internal unsafe pointer reads. It is an
# isolated, build-generated module with its own `allow(unsafe_code)`; all
# hand-written project code is still denied.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
