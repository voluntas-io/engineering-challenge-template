name: Architecture documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  architecture:
    name: Traceability and Mermaid validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test repository gates
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test assurance audit tool
        run: python3 -m unittest discover -s scripts/assurance -p 'test_*.py'

      - name: Check architecture traceability
        run: python3 scripts/check_architecture.py --check

      - name: Parse Mermaid syntax
        uses: sgerrand/mermaid-validation-action@31f8eed257dbbbadad3332c83694866903e92b0e # v0.2.0 release commit
        with:
          fail-on-warning: true
          comment-on-pr: false