[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
base64 = "0.22"
parking_lot = "0.12"
dashmap = "6"
tokio-util = "0.7"
tempfile = "3"

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"

[dev-dependencies]
criterion = { path = "benches/criterion", version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = { path = "tests/proptest", version = "1.6" }

[[bench]]
name = "collector_benches"
harness = false
